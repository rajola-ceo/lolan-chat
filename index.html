<script type="module">

let requestCount=0;const originalFetch=window.fetch.bind(window);

  CHAT_SERVER: 'https://lolan-chat.onrender.com', // Your Render URL, e.g. https://YOUR-SERVICE.onrender.com
  FIREBASE: {

    messagingSenderId: '684551981217',
    appId: '1:684551981217:web:ad8b7e8d5b570575c608e0',

async function createAuth(config) {
  if (!['apiKey', 'authDomain', 'projectId', 'appId'].every(key => config.FIREBASE?.[key])) throw new Error('Add your Firebase web configuration in config.js, then redeploy.');
  let server = null;
  if (config.CHAT_SERVER) {
    server = new URL(config.CHAT_SERVER);
    if (server.username || server.password || (server.protocol !== 'https:' && !(server.protocol === 'http:' && ['localhost', '127.0.0.1'].includes(server.hostname)))) throw new Error('Use your HTTPS Render address in config.js.');
  }
  const [{ initializeApp }, sdk] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js')

  const firebase = sdk.getAuth(initializeApp(config.FIREBASE));

  let recaptcha = null;
  let previousUid;
  const observers = new Set();
  sdk.onAuthStateChanged(firebase, user => {
    if (previousUid !== user?.uid) for (const request of pending) request.abort();
    previousUid = user?.uid;
    for (const listener of observers) listener(user);
  });
  await firebase.authStateReady();

  async function token(force = false) {
    if (!firebase.currentUser) throw new Error('Sign in to continue.');
    return firebase.currentUser.getIdToken(force);
  }

  async function request(path, options = {}, retry = true) {
    if (!server) throw new Error('Chat sync is not connected yet. Deploy the LOLAN chat server on Render, add its HTTPS URL to CHAT_SERVER in config.js, then redeploy Netlify.');
    const user = firebase.currentUser;
    const idToken = await token();
    if (user !== firebase.currentUser) throw new Error('Account changed. Please retry.');
    const controller = new AbortController(); pending.add(controller);
    const timeout = setTimeout(() => controller.abort(), 60000); // Allows a Render cold start.
    let response;
    try {
      const headers = new Headers({ Authorization: `Bearer ${idToken}` });
      if (!options.binaryBody) headers.set('Content-Type', 'application/json');
      else headers.set('Content-Type', options.binaryBody.type);
      response = await fetch(`${server.origin}/api/v1${path}`, {
        method: options.method || 'GET', headers, cache: 'no-store', credentials: 'omit', signal: controller.signal,
        body: options.binaryBody || (options.body === undefined ? undefined : JSON.stringify(options.body))
      });
      if (user !== firebase.currentUser) throw new Error('Account changed. Please retry.');
      if (response.status === 401 && retry) {
        await user.getIdToken(true);
        if (user !== firebase.currentUser) throw new Error('Account changed. Please retry.');
        return request(path, options, false);
      }
      if (options.blob && response.ok) {
        const blob = await response.blob();
        if (user !== firebase.currentUser) throw new Error('Account changed. Please retry.');
        return blob;
      }
      const result = await response.json().catch(() => ({}));
      if (user !== firebase.currentUser) throw new Error('Account changed. Please retry.');
      if (!response.ok) {
        const error = new Error(result.error?.message || `Request failed (${response.status}).`);
        error.code = result.error?.code; error.status = response.status; throw error;
      }
      return result;
    } catch (error) {
      if (error.name === 'AbortError') throw new Error('The request took too long or the account changed. Please retry.');
      if (error instanceof TypeError) throw new Error('Cannot reach LOLAN. Check your connection and try again.');
      throw error;
    } finally { clearTimeout(timeout); pending.delete(controller); }
  }

  return {
    get user() { return firebase.currentUser; },
    get server() { return server?.origin || ''; },
    onChange(listener) { observers.add(listener); listener(firebase.currentUser); return () => observers.delete(listener); },
    signInGoogle() {
      const provider = new sdk.GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
      return sdk.signInWithPopup(firebase, provider);
    },
    signInEmail(email, password) {
      return sdk.signInWithEmailAndPassword(firebase, String(email).trim(), password);
    },
    signUpEmail(email, password) {
      return sdk.createUserWithEmailAndPassword(firebase, String(email).trim(), password);
    },
    async sendPhoneCode(phoneNumber, containerId) {
      if (recaptcha) recaptcha.clear();
      recaptcha = new sdk.RecaptchaVerifier(firebase, containerId, { size: 'normal' });
      phoneConfirmation = await sdk.signInWithPhoneNumber(firebase, String(phoneNumber).trim(), recaptcha);
      return true;
    },
    async confirmPhoneCode(code) {
      if (!phoneConfirmation) throw new Error('Request a verification code first.');
      const result = await phoneConfirmation.confirm(String(code).trim());
      phoneConfirmation = null;
      if (recaptcha) { recaptcha.clear(); recaptcha = null; }
      return result;
    },
    resetPhone() {
      phoneConfirmation = null;
      if (recaptcha) { recaptcha.clear(); recaptcha = null; }
    },
    async signOut() { for (const controller of pending) controller.abort(); await sdk.signOut(firebase); },
    request, token
  };
}

function createFeatures(ctx) {
  const {s,$,esc,icon,toast,config}=ctx;
  const api=(...args)=>ctx.auth().request(...args);
  let preparing=null,eventQueue=Promise.resolve(),activeCall=null,pc=null,local=null,ice=[],recorder=null,recordStream=null,roomToken='',timer=null;
  const blobs=new Set();
  const safe=fn=>async(...args)=>{const b=args[0]?.currentTarget;const button=b?.tagName==='BUTTON'?b:null;if(button){button.disabled=true;button.classList.add('is-busy');}try{return await fn(...args);}catch(e){toast(e.message||'Please try again.');}finally{if(button){button.disabled=false;button.classList.remove('is-busy');}}};
  const skeleton=(n=4)=>`<div class="skeletons" role="status" aria-label="Loading">${'<div class="skeleton-row"><i></i><span></span></div>'.repeat(n)}</div>`;
  function modal(title,content){
    let d=$('#feature-dialog');if(!d){d=document.createElement('dialog');d.id='feature-dialog';document.body.append(d);}
    d.innerHTML=`<div class="dialog-heading"><h2>${esc(title)}</h2><button id="feature-close" class="icon-button" aria-label="Close">${icon('close')}</button></div>${content}`;
    $('#feature-close').onclick=()=>d.close();if(!d.open)d.showModal();return d;
  }
  function linkify(value){return String(value||'').split(/(https?:\/\/[^\s<>]+)/gi).map(part=>/^https?:\/\//i.test(part)?`<a href="${esc(part)}" target="_blank" rel="noopener noreferrer">${esc(part)}</a>`:esc(part)).join('');}
  function mediaMarkup(m){
    if(m.deleted)return '';
    let out='';const a=m.attachment;
    if(a)out=`<div class="shared-media"><button class="secondary-button" data-media="${esc(a.id)}" data-kind="${esc(a.kind)}">Open ${esc(a.kind)} · ${esc(a.name)}</button><button class="text-button" data-download="${esc(a.id)}" data-name="${esc(a.name)}">Download · ${(a.size/1048576).toFixed(1)} MB</button></div>`;
    if(m.location)out+=`<a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps?q=${encodeURIComponent(m.location.latitude+','+m.location.longitude)}">View shared location ↗</a>`;
    return out;
  }
  function bindMedia(root=document){
    root.querySelectorAll('[data-media]').forEach(b=>b.onclick=safe(async()=>{
      b.disabled=true;try{const blob=await api(`/uploads/${b.dataset.media}`,{blob:true});const url=URL.createObjectURL(blob);blobs.add(url);
      const tag=b.dataset.kind==='image'?'img':b.dataset.kind==='audio'?'audio':b.dataset.kind==='video'?'video':null;
      if(!tag){toast('Use Download to save this file.');URL.revokeObjectURL(url);blobs.delete(url);return;}
      const el=document.createElement(tag);el.src=url;el.className='opened-media';el.alt='Shared image';if(tag!=='img'){el.controls=true;el.preload='metadata';}if(tag==='audio'){const speed=document.createElement('button');speed.className='text-button';speed.textContent='1×';speed.setAttribute('aria-label','Voice playback speed');speed.onclick=()=>{el.playbackRate=el.playbackRate===1?1.5:el.playbackRate===1.5?2:1;speed.textContent=el.playbackRate+'×';};b.parentElement.append(speed);}
      b.replaceWith(el);
      }finally{b.disabled=false;}
    }));
    root.querySelectorAll('[data-download]').forEach(b=>b.onclick=safe(async()=>{
      b.disabled=true;try{const blob=await api(`/uploads/${b.dataset.download}?download=1`,{blob:true});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=b.dataset.name||'download';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}finally{b.disabled=false;}
    }));
  }
  async function upload(file){
    if(!file||file.size>10*1024*1024||!file.size)throw new Error('Choose a file between 1 byte and 10 MB.');
    toast('Uploading…');const blob=new Blob([file],{type:'application/octet-stream'});
    return (await api(`/uploads?name=${encodeURIComponent(file.name||'voice-note.webm')}&mime=${encodeURIComponent(file.type||'application/octet-stream')}`,{method:'POST',binaryBody:blob})).attachment;
  }
  async function sendExtra(chatId,extra){
    const result=await api(`/chats/${chatId}/messages`,{method:'POST',body:{text:'',clientMessageId:crypto.randomUUID(),...extra}});
    ctx.putMessage(chatId,result.message);ctx.renderMessages(chatId,true);ctx.queueRefresh();toast('Sent.');
  }
  function attach(chatId){
    const d=modal('Share in chat',`<div class="account-form"><label>Photo, video or file · 10 MB max<input type="file" id="share-file"></label><button id="share-location" class="secondary-button">Share current location</button></div>`);
    $('#share-file').onchange=safe(async e=>{const file=e.target.files[0];if(!file)return;e.target.disabled=true;try{const a=await upload(file);await sendExtra(chatId,{attachmentId:a.id});d.close();}finally{e.target.disabled=false;}});
    $('#share-location').onclick=()=>{if(!navigator.geolocation){toast('Location is unavailable.');return;}navigator.geolocation.getCurrentPosition(safe(async p=>{await sendExtra(chatId,{location:{latitude:p.coords.latitude,longitude:p.coords.longitude}});d.close();}),()=>toast('Location permission was denied or location is unavailable.'),{timeout:15000});};
  }
  async function voice(chatId){
    if(recorder){recorder.stop();return;}
    if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('Voice recording is unavailable in this browser.');
    recordStream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];let size=0;
    const type=['audio/webm;codecs=opus','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
    recorder=new MediaRecorder(recordStream,type?{mimeType:type}:{});const current=recorder;const uid=s.self?.id;
    $('#voice-button')?.classList.add('recording');toast('Recording. Press the microphone again to send.');

async function preparePhoto(file) {
  if (!file || !['image/jpeg', 'image/png', 'image/webp'].includes(file.type) || file.size > 10000000) throw new Error('Choose a JPEG, PNG or WebP photo under 10 MB.');
  const image = await createImageBitmap(file);
  try {
    const canvas = document.createElement('canvas'); canvas.width = canvas.height = 256;
    const context = canvas.getContext('2d'); context.fillStyle = '#202328'; context.fillRect(0, 0, 256, 256);
    const size = Math.min(image.width, image.height);
    context.drawImage(image, (image.width - size) / 2, (image.height - size) / 2, size, size, 0, 0, 256, 256);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .86));
    if (!blob) throw new Error('Could not prepare that photo.');
    return blob;
  } finally { image.close(); }
}

// Messages are kept only in this signed-in page's memory. MongoDB is the
// source of history; localStorage contains only a notification preference.
function putMessage(chatId, message) {
  if (s.hidden.has(message.id)) return;
  const list = s.messages.get(chatId) || [];
  const index = list.findIndex(item => item.id === message.id || (item.senderId === message.senderId && item.clientMessageId === message.clientMessageId));
  if (index >= 0 && !list[index].local && message.local) return;
  if (index >= 0 && !list[index].local && (list[index].revision || 0) > (message.revision || 0)) return;
  const value = { ...message, tick: ++mutationTick };
  if (index < 0) list.push(value); else list[index] = value;
  list.sort((a, b) => a.createdAt.localeCompare(b.createdAt) || a.id.localeCompare(b.id));
  s.messages.set(chatId, list);
}

async function loadMessages(chatId, older = false) {
  if (!s.self || !chatId) return;
  const key = `${chatId}:${older}`; if (loadingMessages.has(key)) return loadingMessages.get(key);
  const epoch = s.epoch; const tick = mutationTick; const cursor = older ? s.older.get(chatId) : null;
  if (older && !cursor) return;
  const task = auth.request(`/chats/${encodeURIComponent(chatId)}/messages${cursor ? `?before=${encodeURIComponent(cursor)}` : ''}`).then(result => {
    if (epoch !== s.epoch) return;
    const log = s.selected === chatId ? $('#message-log') : null;
    const oldHeight = log?.scrollHeight || 0; const oldTop = log?.scrollTop || 0;
    // Preserve events that arrived while this HTTP history request was running.
    const changed = (s.messages.get(chatId) || []).filter(item => older || item.local || item.tick > tick);
    s.messages.set(chatId, []);
    for (const message of result.messages) putMessage(chatId, message);
    for (const message of changed) putMessage(chatId, message);
    s.older.set(chatId, result.before);
    renderMessages(chatId, !older);
    if (older && log) log.scrollTop = oldTop + log.scrollHeight - oldHeight;
    if (!older) markRead();
  }).finally(() => { if (loadingMessages.get(key) === task) loadingMessages.delete(key); });
  loadingMessages.set(key, task); return task;
}

function renderMessages(chatId, bottom = false) {

  }).join('') || `<div class="empty-list">${loadingMessages.has(`${chatId}:false`) ? 'Loading messages…' : 'Say hello to start this conversation.'}</div>`;

function sendMessage() {
  const input = $('#message-input'); const content = input?.value.trim();
  if (!content || !s.selected || content.length > 4000) return;
  const nonce = crypto.randomUUID(); const chatId = s.selected;
  putMessage(chatId, { id: `local-${nonce}`, chatId, senderId: s.self.id, clientMessageId: nonce, text: content, createdAt: new Date().toISOString(), local: 'sending', replyTo: s.reply ? { ...s.reply } : null, reactions: [] });
  s.drafts.delete(chatId); input.value = ''; input.style.height = 'auto'; s.reply = null; renderReply(); sendTyping(false);
  renderMessages(chatId, true); deliver(chatId, `local-${nonce}`);

async function deliver(chatId, messageId) {
  const item = (s.messages.get(chatId) || []).find(message => message.id === messageId);
  if (!item?.local || item.inflight) return;
  item.inflight = true; item.local = 'sending'; renderMessages(chatId);
  const epoch = s.epoch;
  try {
    const result = await auth.request(`/chats/${chatId}/messages`, { method: 'POST', body: { clientMessageId: item.clientMessageId, text: item.text, ...(item.replyTo ? { replyId: item.replyTo.id } : {}) } });
    if (epoch !== s.epoch) return;
    putMessage(chatId, result.message); renderMessages(chatId, true); queueRefresh(); markRead();
  } catch (error) {

    // A WebSocket acknowledgement may already have replaced this optimistic
    // item even if the HTTP response was interrupted. Never mark that failed.
    const pending = (s.messages.get(chatId) || []).find(message => message.id === messageId && message.local);
    if (pending) { pending.inflight = false; pending.local = 'failed'; toast(error.message); renderMessages(chatId); }
  }

async function markRead() {

  if (!last || readPositions.get(chatId) === last.id) return;
  const epoch = s.epoch; readPositions.set(chatId, last.id);

    await auth.request(`/chats/${chatId}/read`, { method: 'PUT', body: { messageId: last.id } });

    const chat = s.chats.find(item => item.id === chatId); if (chat) chat.unread = 0; renderList();

}

async function react(chatId, messageId, emoji) {

  const epoch = s.epoch;

    $('#edit-form').onsubmit = async event => {
      event.preventDefault(); const button = event.currentTarget.querySelector('button'); button.disabled = true;
      try { const result = await auth.request(`/chats/${chatId}/messages/${messageId}`, { method: 'PATCH', body: { text: $('#edit-content').value } }); if (epoch !== s.epoch) return; putMessage(chatId, result.message); element.close(); renderMessages(chatId); queueRefresh(); }
      catch (error) { if (epoch === s.epoch && $('#action-error')) $('#action-error').textContent = error.message; }
      finally { button.disabled = false; }
    };
  };
  const remove = scope => async event => {
    if (!confirm(scope === 'everyone' ? 'Delete this message for everyone? Copies already seen or saved cannot be recalled.' : 'Hide this message from your account?')) return;
    const button = event.currentTarget; button.disabled = true;
    try {
      const result = await auth.request(`/chats/${chatId}/messages/${messageId}?scope=${scope}`, { method: 'DELETE' });
      if (epoch !== s.epoch) return;
      if (scope === 'me') hideMessage(chatId, messageId); else putMessage(chatId, result.message);
      element.close(); renderMessages(chatId); queueRefresh();
    } catch (error) { if (epoch === s.epoch && $('#action-error')) $('#action-error').textContent = error.message; }
    finally { button.disabled = false; }
  };
  $('#delete-me').onclick = remove('me'); if ($('#delete-all')) $('#delete-all').onclick = remove('everyone');
}

function hideMessage(chatId, id) { s.hidden.add(id); s.messages.set(chatId, (s.messages.get(chatId) || []).filter(item => item.id !== id)); }

function disconnect() {
  clearTimeout(s.reconnect); s.reconnect = null;
  const socket = s.socket; s.socket = null; socket?.close();
}
function sendTyping(active) { if (s.socket?.readyState === WebSocket.OPEN && s.socket.authenticated && s.selected) s.socket.send(JSON.stringify({ type: 'typing', chatId: s.selected, active })); }
function connect() {
  if (!s.self || s.socket) return;
  const url = new URL('/ws', auth.server); url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
  const socket = new WebSocket(url); s.socket = socket; const epoch = s.epoch;
  $('#connection-state').textContent = 'Connecting…';
  socket.onopen = async () => {
    try { const token = await auth.token(); if (s.socket === socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'auth', token })); }
    catch { socket.close(); }
  };
  socket.onerror = () => {}; // The close handler owns retries and user status.
  socket.onclose = event => {
    if (s.socket !== socket || epoch !== s.epoch) return;
    s.socket = null;
    if (event.code === 4008) { $('#connection-state').textContent = 'Close another LOLAN tab, then reload.'; return; }
    $('#connection-state').textContent = 'Reconnecting…';
    s.reconnect = setTimeout(() => connect(), Math.min(30000, 1000 * 2 ** Math.min(retryCount++, 5)) + Math.random() * 500);
  };
  socket.onmessage = event => {
    if (s.socket !== socket || epoch !== s.epoch) return;
    let data; try { data = JSON.parse(event.data); } catch { return; }
    if (data.type === 'ready') {
      if (data.userId !== s.self.id) { socket.close(); return; }
      socket.authenticated = true; retryCount = 0; $('#connection-state').textContent = 'Connected';
      syncChats().then(async () => {
        if (epoch !== s.epoch) return;
        if (s.selected && s.section === 'chats') { if (!$('#message-log')) renderConversation(); await loadMessages(s.selected); }
      }).catch(error => { if (epoch === s.epoch) toast(error.message); }); return;
    }
    if (!socket.authenticated) return;
    features.event(data);
    if (['message.created', 'message.updated'].includes(data.type) && data.message) {
      const known = (s.messages.get(data.chatId) || []).some(item => item.id === data.message.id);
      putMessage(data.chatId, data.message); renderMessages(data.chatId); markRead(); queueRefresh();
      if (data.type === 'message.created' && !known && data.message.senderId !== s.self.id) notifyMessage(data);
    } else if (data.type === 'message.hidden') { hideMessage(data.chatId, data.messageId); renderMessages(data.chatId); queueRefresh(); }
    else if (data.type === 'chats.changed') queueRefresh();
    else if (data.type === 'chats.read') { const chat = s.chats.find(item => item.id === data.chatId); if (chat) chat.unread = 0; renderList(); }
    else if (data.type === 'typing' && data.chatId === s.selected && $('#typing-status')) {
      clearTimeout(typingTimer); $('#typing-status').classList.toggle('is-typing',data.active === true); $('#typing-status').textContent = data.active ? `@${s.users.get(data.userId)?.username || 'Contact'} is writing` : '';
      typingTimer = setTimeout(() => { if ($('#typing-status')) { $('#typing-status').textContent = ''; $('#typing-status').classList.remove('is-typing'); } }, 4000);
    }
  };
}

function notifyMessage(event) {
  if (!s.notify || document.visibilityState === 'visible' || !('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const notification = new Notification('New message on LOLAN', { body: `@${s.users.get(event.message.senderId)?.username || 'A contact'} sent you a message.`, tag: `lolan-${event.chatId}` });
    notification.onclick = () => { window.focus(); location.hash = `/chats/${event.chatId}`; notification.close(); };
    setTimeout(() => notification.close(), 12000);
  } catch { /* Some mobile browsers require service-worker push instead. */ }
}

async function openDirect(user) {
  const epoch = s.epoch;
  try {
    const result = await auth.request('/chats/direct', { method: 'POST', body: { userId: user.id } });
    if (epoch !== s.epoch) return;
    storeUsers(result.users); s.chats = [result.chat, ...s.chats.filter(item => item.id !== result.chat.id)];
    document.querySelectorAll('dialog[open]').forEach(element => element.close());
    const hash = `#/chats/${result.chat.id}`;
    if (location.hash === hash) route(); else location.hash = hash;
    renderList();
  } catch (error) { if (epoch === s.epoch) toast(error.message); }
}

async function saveContact(user, save) {
  const epoch = s.epoch;
  await auth.request(`/contacts/${encodeURIComponent(user.id)}`, { method: save ? 'PUT' : 'DELETE' });
  if (epoch !== s.epoch) return;
  if (save) s.contacts.add(user.id); else s.contacts.delete(user.id);
  toast(save ? 'Contact saved.' : 'Contact removed.');
}

async function showContacts() {
  const epoch = s.epoch;
  const element = dialog('contact', heading('Contacts', 'contact-title') + `<label class="search-box">${icon('search')}<input id="contact-search" type="search" placeholder="Find @username" aria-label="Find a LOLAN username" maxlength="25" autocomplete="off"></label><p id="contact-status" class="form-hint">Loading your contacts…</p><div id="contact-results" class="contact-list"></div>`);
  let timer; let revision = 0; let saved = [];
  const draw = users => {
    if (epoch !== s.epoch || !element.open || !$('#contact-results')) return;
    storeUsers(users);
    $('#contact-results').innerHTML = users.map(user => `<div class="live-contact"><button class="contact-row" data-person="${esc(user.id)}">${avatar(user)}<span><strong>${esc(user.name)}</strong><span class="person-handle">@${esc(user.username)}</span></span></button><button class="icon-button" data-open="${esc(user.id)}" aria-label="Message ${esc(user.name)}" title="Message">${icon('chats')}</button></div>`).join('');
    element.querySelectorAll('[data-person]').forEach(button => button.onclick = () => { element.close(); showProfile(s.users.get(button.dataset.person)); });
    element.querySelectorAll('[data-open]').forEach(button => button.onclick = async () => { button.disabled = true; await openDirect(s.users.get(button.dataset.open)); if (button.isConnected) button.disabled = false; });
    paintAvatars();
  };
  $('#contact-search').oninput = event => {
    clearTimeout(timer); const current = ++revision; const query = event.target.value.trim().replace(/^@/, '');
    if (!query) { draw(saved); $('#contact-status').textContent = saved.length ? 'Saved contacts' : 'Search a username to find your first contact.'; return; }
    if (query.length < 2) { draw([]); $('#contact-status').textContent = 'Enter at least two characters.'; return; }
    $('#contact-status').textContent = 'Searching…';
    timer = setTimeout(async () => {
      try {
        const result = await auth.request(`/users?q=${encodeURIComponent(query)}`);
        if (epoch !== s.epoch || current !== revision || !element.open || !$('#contact-status')) return;
        draw(result.users); $('#contact-status').textContent = result.users.length ? 'Select a profile or start a chat.' : 'No matching usernames.';
      } catch (error) { if (epoch === s.epoch && current === revision && $('#contact-status')) $('#contact-status').textContent = error.message; }
    }, 350);
  };
  element.addEventListener('close', () => clearTimeout(timer), { once: true });
  try {
    const result = await auth.request('/contacts'); if (epoch !== s.epoch) return;
    saved = result.users; s.contacts = new Set(saved.map(user => user.id)); storeUsers(saved);
    if (revision === 0 && element.open && $('#contact-status')) { draw(saved); $('#contact-status').textContent = saved.length ? 'Saved contacts' : 'Search a username to find your first contact.'; }
  } catch (error) { if (epoch === s.epoch && element.open && $('#contact-status')) $('#contact-status').textContent = error.message; }
}

function showProfile(user) {
  if (!user || !s.self) return;
  const mine = user.id === s.self.id; const epoch = s.epoch;
  const element = dialog('profile', heading(mine ? 'Your profile' : 'Profile', 'profile-title') + `<div class="profile-content-wrap">${avatar(user)}<h3>${esc(user.name)}</h3><p class="person-handle">@${esc(user.username)}</p>${user.bio ? `<p class="profile-bio">${esc(user.bio)}</p>` : ''}</div>` + (mine ? `<form id="profile-edit" class="account-form"><label>Display name<input name="name" maxlength="60" required value="${esc(user.name)}"></label><label>About you<textarea name="bio" maxlength="240" rows="2">${esc(user.bio)}</textarea></label><label>Change profile photo<input id="edit-photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p id="profile-edit-error" class="form-error" role="alert"></p><button class="primary-button" type="submit">Save changes</button></form><div class="button-row"><button id="profile-settings" class="text-button">Settings</button><button id="profile-logout" class="text-button">Sign out</button></div>` : `<div class="button-row"><button id="profile-message" class="primary-button">${icon('chats')}Message</button><button id="profile-contact" class="secondary-button">${s.contacts.has(user.id) ? 'Remove contact' : 'Add contact'}</button></div><p class="profile-note">You connect through your LOLAN username. Your Google email is not shown to other users.</p>`));
  paintAvatars();
  if (mine) {
    $('#profile-settings').onclick = () => { element.close(); showSettings(); };
    $('#profile-logout').onclick = async () => { try { await features.signOut(); } catch (error) { toast(error.message); } };
    $('#profile-edit').onsubmit = async event => {
      event.preventDefault(); const form = event.currentTarget; const button = form.querySelector('button[type="submit"]'); button.disabled = true;
      const values = new FormData(form); const file = $('#edit-photo').files[0]; let saved = false;
      try {
        const photo = file ? await preparePhoto(file) : null;
        const result = await auth.request('/me', { method: 'PATCH', body: { name: values.get('name'), bio: values.get('bio') } });
        if (epoch !== s.epoch) return;
        s.self = result.user; storeUsers([result.user]); saved = true;
        if (photo) { const uploaded = await auth.request('/me/avatar', { method: 'PUT', binaryBody: photo }); if (epoch !== s.epoch) return; s.self = uploaded.user; storeUsers([uploaded.user]); }
        renderNav(); renderList(); element.close(); toast('Profile updated.');
      } catch (error) { if (epoch === s.epoch && $('#profile-edit-error')) { $('#profile-edit-error').textContent = `${saved ? 'Name and bio saved. Photo: ' : ''}${error.message}`; renderNav(); } }
      finally { button.disabled = false; }
    };
  } else {
    $('#profile-message').onclick = async event => { const button = event.currentTarget; button.disabled = true; await openDirect(user); if (button.isConnected) button.disabled = false; };
    $('#profile-contact').onclick = async event => {
      const button = event.currentTarget; button.disabled = true;
      try { await saveContact(user, !s.contacts.has(user.id)); if (epoch === s.epoch && element.open) button.textContent = s.contacts.has(user.id) ? 'Remove contact' : 'Add contact'; }
      catch (error) { if (epoch === s.epoch) toast(error.message); }
      finally { button.disabled = false; }
    };
    auth.request('/contacts').then(result => { if (epoch !== s.epoch || !element.open || !$('#profile-contact')) return; s.contacts = new Set(result.users.map(item => item.id)); $('#profile-contact').textContent = s.contacts.has(user.id) ? 'Remove contact' : 'Add contact'; }).catch(() => {});
  }
}

function showSettings() {
  const epoch = s.epoch;
  const element = dialog('settings', heading('Settings', 'settings-title') + `<div class="setting-row"><div><strong>Browser notifications</strong><p>Message alerts while LOLAN is open.</p></div><input id="browser-notifications" type="checkbox" aria-label="Browser notifications" ${s.notify ? 'checked' : ''}></div><p class="profile-note">This single-file edition receives alerts while open. Closed-app push requires a separate service worker.</p><p class="profile-note">This release uses Google sign-in and secure connections, but messages are stored as readable text on the server. End-to-end encryption will be a separate upgrade.</p><button id="settings-profile" class="text-button">Edit your profile</button>`);
  $('#settings-profile').onclick = () => { element.close(); showProfile(s.self); };
  $('#browser-notifications').onchange = async event => {
    const input = event.currentTarget; input.disabled = true;
    try {
      if (input.checked) {
        if (!('Notification' in window)) throw new Error('This browser does not support these notifications.');
        const permission = await Notification.requestPermission();
        if (epoch !== s.epoch) return;
        if (permission !== 'granted') throw new Error('Notifications are blocked. You can allow them in your browser’s site settings.');
      }
      if (epoch !== s.epoch) return; await features.enablePush(input.checked); s.notify = input.checked;
      try { localStorage.setItem(`lolan.notifications.${s.self.id}`, String(s.notify)); } catch { /* Memory-only preference remains usable. */ }
    } catch (error) { if (epoch === s.epoch) { s.notify = false; input.checked = false; toast(error.message); } }
    finally { input.disabled = false; }
  };
}

$('#search-icon').innerHTML = icon('search');
$('#chat-search').oninput = event => { s.search = event.target.value; renderList(); };
document.querySelectorAll('[data-filter]').forEach(button => button.onclick = () => { s.filter = button.dataset.filter; renderList(); });
$('#contacts-button').onclick = showContacts;
window.addEventListener('hashchange', () => route());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !s.self) return;
  if (!s.socket) { clearTimeout(s.reconnect); connect(); }
  const epoch = s.epoch;
  syncChats().then(() => { if (epoch === s.epoch && s.section === 'chats' && s.selected) return loadMessages(s.selected); }).catch(error => { if (epoch === s.epoch) toast(error.message); });
});
window.addEventListener('pagehide', disconnect);
window.addEventListener('pageshow', () => { if (s.self) connect(); });

if (location.protocol === 'file:') {
  authScreen(`<h1>LOLAN needs a web address.</h1><p>Open LOLAN through GitHub Pages or a local web server to sign in. Direct file preview cannot complete Google authentication.</p><p class="form-hint">For quick local testing, use VS Code Live Server, or run <code>python -m http.server 5500</code> inside the <code>frontend</code> folder and open <code>http://localhost:5500</code>.</p>`);
} else {
  try { auth = await createAuth(config); auth.onChange(user => bootAccount(user)); }
  catch (error) { authScreen(`<h1>Finish connecting LOLAN.</h1><p>${esc(error.message)}</p><p class="form-hint">Check your connection, Firebase authorized domain and Render allowed origins.</p>`); }
}

</script>
</body>
</html>
